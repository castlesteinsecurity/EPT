<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rota Segura · GPS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  (() => {
    const SUPABASE_URL      = "https://siqrztzyikunnxmzvjez.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJmZWF1a2Z5dmd2a2tyampvZmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1NDcxNzYsImV4cCI6MjA5NDEyMzE3Nn0.k2sD3NT_1yysDyNdQy2e0V4ro4kYBC4G7jjzTS3jtZU";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const params = new URLSearchParams(window.location.search);
    const rawBusId = params.get('bus_id');
    
    // Garante que o bus_id seja tratado como número se for numérico, evitando incompatibilidade no Supabase
    const busId = (!isNaN(rawBusId) && rawBusId !== null) ? Number(rawBusId) : rawBusId;

    const ring       = document.getElementById('statusRing');
    const titleEl    = document.getElementById('statusTitle');
    const subEl      = document.getElementById('statusSub');
    const infoVeh    = document.getElementById('infoVehicle');
    const infoSt     = document.getElementById('infoStatus');
    const infoLat    = document.getElementById('infoLat');
    const infoLon    = document.getElementById('infoLon');
    const btnStart   = document.getElementById('btnStart');
    const btnStop    = document.getElementById('btnStop');
    const updateLog  = document.getElementById('updateLog');
    const errorBox   = document.getElementById('errorBox');

    let watchId = null;

    if (!busId) {
      showError('Link inválido. Peça ao administrador um novo link de pareamento.');
      btnStart.disabled = true;
    } else {
      infoVeh.textContent = `Prefixo ${busId}`;
    }

    function showError(msg) {
      errorBox.textContent  = msg;
      errorBox.style.display = 'block';
      ring.className = 'status-ring error';
      titleEl.textContent = 'Erro';
      subEl.textContent   = msg;
    }

    function setActive(active) {
      if (active) {
        ring.className      = 'status-ring';
        titleEl.textContent = 'Transmitindo';
        subEl.textContent   = 'Sua localização está sendo enviada ao painel em tempo real.';
        infoSt.textContent  = 'Transmitindo';
        btnStart.style.display = 'none';
        btnStop.style.display  = 'flex';
      } else {
        ring.className      = 'status-ring inactive';
        titleEl.textContent = 'GPS inativo';
        subEl.textContent   = 'Pressione Iniciar Transmissão para enviar sua localização.';
        infoSt.textContent  = 'Parado';
        infoLat.textContent = '—';
        infoLon.textContent = '—';
        updateLog.textContent = '—';
        btnStart.style.display = 'flex';
        btnStop.style.display  = 'none';
      }
    }

    async function sendPosition(lat, lon) {
      infoLat.textContent = lat.toFixed(6);
      infoLon.textContent = lon.toFixed(6);

      // Envio para o Supabase
      const { error } = await db.from('bus_positions').upsert({
        bus_id:     busId,
        latitude:   lat,
        longitude:  lon,
        updated_at: new Date().toISOString()
      }, { onConflict: 'bus_id' });

      const now = new Date().toLocaleTimeString('pt-BR', { hour12: false });
      if (error) {
        updateLog.textContent = `[${now}] Erro: ${error.message}`;
        console.error("Supabase Upsert Error:", error);
      } else {
        updateLog.textContent = `[${now}] Sinal de GPS enviado.`;
      }
    }

    btnStart.addEventListener('click', () => {
      // Validação de HTTPS (Obrigatório em dispositivos móveis)
      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        showError('O GPS só funciona através de conexões seguras (HTTPS).');
        return;
      }

      if (!navigator.geolocation) {
        showError('Seu navegador não suporta geolocalização.');
        return;
      }

      btnStart.disabled = true;

      // Inicia captura contínua
      watchId = navigator.geolocation.watchPosition(
        pos => {
          btnStart.disabled = false;
          setActive(true);
          sendPosition(pos.coords.latitude, pos.coords.longitude);
        },
        err => {
          btnStart.disabled = false;
          let errMsg = 'Erro de GPS.';
          if (err.code === 1) errMsg = 'Permissão de GPS negada pelo celular.';
          if (err.code === 2) errMsg = 'Sinal de GPS indisponível no momento.';
          if (err.code === 3) errMsg = 'Tempo limite esgotado ao buscar GPS.';
          showError(errMsg);
        },
        { 
          enableHighAccuracy: true, 
          maximumAge: 0, 
          timeout: 15000 
        }
      );
    });

    btnStop.addEventListener('click', async () => {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }

      await db.from('bus_positions').upsert({
        bus_id:     busId,
        latitude:   0,
        longitude:  0,
        updated_at: new Date().toISOString()
      }, { onConflict: 'bus_id' });

      setActive(false);
    });

  })();
</script>
</body>
</html>
